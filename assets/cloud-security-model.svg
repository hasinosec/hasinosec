<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Cloud security reference model</title>
  <desc id="d">Layered view of how a cloud account is secured: organisation guardrails and SCPs at the top, then identity with least-privilege IAM and federation, network segmentation with private subnets, data protection with encryption and secrets management, detection and response with CloudTrail, GuardDuty and automated remediation, and a CI layer running IaC and secret scanning before deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8ab4ff"/></marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="26" font-weight="800">Cloud Security Reference Model</text>
  <text x="48" y="80" fill="#94a3b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15">How I harden an account: guardrails &#8594; identity &#8594; network &#8594; data &#8594; detection, with security checks in CI before anything ships.</text>

  <g font-family="Segoe UI, system-ui, Arial, sans-serif">
    <!-- Layer 1 Guardrails -->
    <rect x="48" y="108" width="1104" height="78" rx="14" fill="#3b1d6e" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="72" y="140" fill="#ede9fe" font-size="17" font-weight="800">1 &#183; Organisation Guardrails</text>
    <text x="72" y="166" fill="#c4b5fd" font-size="13">Service Control Policies &#183; region lock &#183; deny root &#183; deny disabling logging &#183; mandatory encryption</text>

    <!-- Layer 2 Identity -->
    <rect x="48" y="204" width="1104" height="78" rx="14" fill="#0e4f4a" stroke="#34d399" stroke-width="1.5"/>
    <text x="72" y="236" fill="#d1fae5" font-size="17" font-weight="800">2 &#183; Identity &amp; Access</text>
    <text x="72" y="262" fill="#6ee7b7" font-size="13">Least-privilege IAM roles &#183; no long-lived keys &#183; OIDC federation for CI &#183; Access Analyzer &#183; MFA</text>

    <!-- Layer 3 Network -->
    <rect x="48" y="300" width="1104" height="78" rx="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="72" y="332" fill="#e0f2fe" font-size="17" font-weight="800">3 &#183; Network Segmentation</text>
    <text x="72" y="358" fill="#7dd3fc" font-size="13">VPC with private data subnets &#183; databases never internet-facing &#183; tight security groups &#183; no public S3</text>

    <!-- Layer 4 Data -->
    <rect x="48" y="396" width="1104" height="78" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
    <text x="72" y="428" fill="#ffedd5" font-size="17" font-weight="800">4 &#183; Data Protection</text>
    <text x="72" y="454" fill="#fdba74" font-size="13">Encryption at rest &amp; in transit &#183; S3 versioning + public-access block &#183; secrets in Secrets Manager, not code</text>

    <!-- Layer 5 Detection -->
    <rect x="48" y="492" width="1104" height="78" rx="14" fill="#831843" stroke="#fb7185" stroke-width="1.5"/>
    <text x="72" y="524" fill="#ffe4e6" font-size="17" font-weight="800">5 &#183; Detection &amp; Response</text>
    <text x="72" y="550" fill="#fda4af" font-size="13">Org CloudTrail &#183; GuardDuty &#183; Security Hub &#183; Config rules &#183; EventBridge + Lambda auto-remediation</text>

    <!-- CI rail -->
    <rect x="48" y="588" width="1104" height="34" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="600" y="610" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">CI gate before deploy: gitleaks &#183; Checkov &#183; tfsec &#183; Trivy &#183; policy-as-code (OPA) &#8212; build fails on High/Critical</text>

    <g stroke="#8ab4ff" stroke-width="2" marker-end="url(#ar)" opacity="0.8">
      <line x1="600" y1="186" x2="600" y2="202"/>
      <line x1="600" y1="282" x2="600" y2="298"/>
      <line x1="600" y1="378" x2="600" y2="394"/>
      <line x1="600" y1="474" x2="600" y2="490"/>
    </g>
  </g>
</svg>
