<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">File Integrity Monitor workflow</title><desc id="desc">A colourful diagram showing trusted files turned into a SHA-256 baseline, rescanned later, compared and alerted on modification, deletion or creation.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#063b36"/><stop offset="1" stop-color="#0b6b59"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#bbf7d0"/></marker></defs>
  <rect width="1200" height="430" fill="url(#bg)" rx="28"/><text x="55" y="65" fill="#fff" font-family="Arial" font-size="32" font-weight="700">File Integrity Monitor — Detection Workflow</text><text x="55" y="98" fill="#bbf7d0" font-family="Arial" font-size="17">Python SHA-256 security-monitoring project • illustrative workflow</text>
  <g font-family="Arial" text-anchor="middle"><rect x="45" y="170" width="210" height="130" rx="18" fill="#15803d"/><text x="150" y="219" fill="#fff" font-size="21" font-weight="700">Trusted Files</text><text x="150" y="251" fill="#dcfce7" font-size="15">Select sensitive</text><text x="150" y="274" fill="#dcfce7" font-size="15">paths to monitor</text><rect x="325" y="170" width="210" height="130" rx="18" fill="#0369a1"/><text x="430" y="219" fill="#fff" font-size="21" font-weight="700">SHA-256 Baseline</text><text x="430" y="251" fill="#e0f2fe" font-size="15">Create trusted file</text><text x="430" y="274" fill="#e0f2fe" font-size="15">fingerprints</text><rect x="605" y="170" width="210" height="130" rx="18" fill="#7c3aed"/><text x="710" y="219" fill="#fff" font-size="21" font-weight="700">Rescan + Compare</text><text x="710" y="251" fill="#ede9fe" font-size="15">Calculate current</text><text x="710" y="274" fill="#ede9fe" font-size="15">file fingerprints</text><rect x="885" y="170" width="270" height="130" rx="18" fill="#b91c1c"/><text x="1020" y="219" fill="#fff" font-size="21" font-weight="700">Integrity Alert</text><text x="1020" y="251" fill="#fee2e2" font-size="15">Modified, new, or</text><text x="1020" y="274" fill="#fee2e2" font-size="15">deleted file detected</text></g>
  <g stroke="#bbf7d0" stroke-width="5" marker-end="url(#arrow)"><line x1="255" y1="235" x2="325" y2="235"/><line x1="535" y1="235" x2="605" y2="235"/><line x1="815" y1="235" x2="885" y2="235"/></g>
  <text x="600" y="365" text-anchor="middle" fill="#d1fae5" font-family="Arial" font-size="17">Security goal: surface unexpected change so it can be investigated before it becomes a larger incident.</text>
</svg>
