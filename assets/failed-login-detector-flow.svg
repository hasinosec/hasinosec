<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Failed Login Detector workflow</title><desc id="desc">A colourful diagram of authentication logs being parsed, grouped by IP, tested against a threshold and time window, then generating a security alert.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#201144"/><stop offset="1" stop-color="#512a8a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#e9d5ff"/></marker></defs>
  <rect width="1200" height="430" fill="url(#bg)" rx="28"/><text x="55" y="65" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Failed Login Detector — Detection Workflow</text><text x="55" y="98" fill="#e9d5ff" font-family="Arial" font-size="17">Python security-monitoring project • illustrative workflow</text>
  <g font-family="Arial" text-anchor="middle"><rect x="55" y="170" width="200" height="130" rx="18" fill="#2563eb"/><text x="155" y="219" fill="#fff" font-size="21" font-weight="700">Authentication Logs</text><text x="155" y="251" fill="#dbeafe" font-size="15">Failed and successful</text><text x="155" y="274" fill="#dbeafe" font-size="15">login events</text><rect x="335" y="170" width="200" height="130" rx="18" fill="#0891b2"/><text x="435" y="219" fill="#fff" font-size="21" font-weight="700">Parse Events</text><text x="435" y="251" fill="#cffafe" font-size="15">Validate timestamp,</text><text x="435" y="274" fill="#cffafe" font-size="15">event, user, IP</text><rect x="615" y="170" width="200" height="130" rx="18" fill="#7c3aed"/><text x="715" y="219" fill="#fff" font-size="21" font-weight="700">Group by IP</text><text x="715" y="251" fill="#ede9fe" font-size="15">Count failures in</text><text x="715" y="274" fill="#ede9fe" font-size="15">a time window</text><rect x="895" y="170" width="250" height="130" rx="18" fill="#dc2626"/><text x="1020" y="219" fill="#fff" font-size="21" font-weight="700">Security Alert</text><text x="1020" y="251" fill="#fee2e2" font-size="15">Threshold exceeded:</text><text x="1020" y="274" fill="#fee2e2" font-size="15">possible brute force</text></g>
  <g stroke="#e9d5ff" stroke-width="5" marker-end="url(#arrow)"><line x1="255" y1="235" x2="335" y2="235"/><line x1="535" y1="235" x2="615" y2="235"/><line x1="815" y1="235" x2="895" y2="235"/></g>
  <text x="600" y="365" text-anchor="middle" fill="#f3e8ff" font-family="Arial" font-size="17">Configurable rule: alert after a chosen number of failed attempts within a chosen number of minutes.</text>
</svg>
