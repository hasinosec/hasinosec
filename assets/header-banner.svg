<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Ismail Hassan — Cloud Security &amp; DevSecOps Engineer</title>
  <desc id="d">Banner showing the name, role, and focus areas: AWS, Azure, Terraform, IAM, detection engineering, and information security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#141e37"/>
      <stop offset="1" stop-color="#231544"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#8ab4ff" stroke-width="1.2">
    <circle cx="1040" cy="70" r="130" fill="none"/>
    <circle cx="1040" cy="70" r="90" fill="none"/>
    <circle cx="1040" cy="70" r="50" fill="none"/>
    <line x1="60" y1="232" x2="1140" y2="232"/>
  </g>

  <rect x="56" y="52" width="8" height="120" rx="4" fill="url(#accent)"/>
  <text x="84" y="92" fill="#ffffff" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-size="42" font-weight="800">Ismail Hassan</text>
  <text x="84" y="132" fill="#c7d2fe" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="23" font-weight="600">Cloud Security &amp; DevSecOps Engineer</text>
  <text x="84" y="164" fill="#94a3b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="16">Securing cloud infrastructure with code, guardrails, and detections</text>

  <g font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15" font-weight="700" filter="url(#soft)">
    <g transform="translate(84,196)">
      <rect width="86" height="34" rx="17" fill="#0ea5e9"/><text x="43" y="22" text-anchor="middle" fill="#04283b">AWS</text>
    </g>
    <g transform="translate(180,196)">
      <rect width="92" height="34" rx="17" fill="#3b82f6"/><text x="46" y="22" text-anchor="middle" fill="#04183b">Azure</text>
    </g>
    <g transform="translate(282,196)">
      <rect width="122" height="34" rx="17" fill="#7c3aed"/><text x="61" y="22" text-anchor="middle" fill="#f5f3ff">Terraform</text>
    </g>
    <g transform="translate(414,196)">
      <rect width="150" height="34" rx="17" fill="#0d9488"/><text x="75" y="22" text-anchor="middle" fill="#ecfeff">IAM &#183; Least Priv</text>
    </g>
    <g transform="translate(574,196)">
      <rect width="176" height="34" rx="17" fill="#d97706"/><text x="88" y="22" text-anchor="middle" fill="#fffbeb">Detection Engineering</text>
    </g>
    <g transform="translate(760,196)">
      <rect width="150" height="34" rx="17" fill="#e11d48"/><text x="75" y="22" text-anchor="middle" fill="#fff1f2">5 CVEs Assigned</text>
    </g>
  </g>
</svg>
