<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">File Vault CI security pipeline</title>
  <desc id="d">The pipeline that runs on every push to File Vault. Blocking jobs: gitleaks secret scan, npm audit at high severity, terraform fmt and validate, and the Docker build. Reporting jobs that upload SARIF to the GitHub Security tab: Checkov, tfsec, and Trivy image scan. CI holds no cloud credentials and cannot deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1a1330"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0 0L11 3.5L0 7Z" fill="#e2e8f0"/></marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" fill="#ffffff" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="24" font-weight="800">File Vault &#8212; CI security pipeline</text>
  <text x="48" y="80" fill="#94a3b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15">Runs on every push. CI has no cloud credentials and cannot deploy.</text>

  <!-- blocking row -->
  <text x="48" y="122" fill="#fca5a5" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13" font-weight="700">BLOCKS THE BUILD</text>
  <g font-family="Segoe UI, system-ui, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <g transform="translate(48,134)"><rect width="150" height="86" rx="14" fill="#0e7490"/><text x="75" y="38" fill="#fff" font-size="15">Secret scan</text><text x="75" y="60" fill="#cffafe" font-size="12">gitleaks</text></g>
    <g transform="translate(226,134)"><rect width="170" height="86" rx="14" fill="#4338ca"/><text x="85" y="38" fill="#fff" font-size="15">App checks</text><text x="85" y="58" fill="#e0e7ff" font-size="12">node --check</text><text x="85" y="74" fill="#e0e7ff" font-size="12">npm audit (high)</text></g>
    <g transform="translate(424,134)"><rect width="180" height="86" rx="14" fill="#b45309"/><text x="90" y="38" fill="#fff" font-size="15">Terraform</text><text x="90" y="58" fill="#fef3c7" font-size="12">fmt -check</text><text x="90" y="74" fill="#fef3c7" font-size="12">validate</text></g>
    <g transform="translate(632,134)"><rect width="160" height="86" rx="14" fill="#7c3aed"/><text x="80" y="38" fill="#fff" font-size="15">Docker build</text><text x="80" y="60" fill="#ede9fe" font-size="12">image builds</text></g>
  </g>

  <!-- reporting row -->
  <text x="48" y="266" fill="#fdba74" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13" font-weight="700">REPORTS TO THE SECURITY TAB (SARIF)</text>
  <g font-family="Segoe UI, system-ui, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <g transform="translate(48,278)"><rect width="160" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="80" y="36" fill="#fff" font-size="15">Checkov</text><text x="80" y="58" fill="#fcd34d" font-size="12">IaC misconfig</text></g>
    <g transform="translate(236,278)"><rect width="160" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="80" y="36" fill="#fff" font-size="15">Trivy IaC</text><text x="80" y="58" fill="#fcd34d" font-size="12">config scan</text></g>
    <g transform="translate(424,278)"><rect width="170" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="85" y="36" fill="#fff" font-size="15">Trivy image</text><text x="85" y="58" fill="#fcd34d" font-size="12">image CVEs</text></g>
  </g>

  <!-- deploy -->
  <g font-family="Segoe UI, system-ui, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <g transform="translate(880,190)"><rect width="270" height="120" rx="16" fill="#047857"/><text x="135" y="46" fill="#fff" font-size="16">Deploy (manual)</text><text x="135" y="72" fill="#d1fae5" font-size="12">terraform apply from a</text><text x="135" y="90" fill="#d1fae5" font-size="12">workstation &#183; planned: GitHub OIDC</text></g>
  </g>

  <g stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#a)">
    <line x1="198" y1="177" x2="224" y2="177"/>
    <line x1="396" y1="177" x2="422" y2="177"/>
    <line x1="604" y1="177" x2="630" y2="177"/>
    <line x1="792" y1="205" x2="876" y2="230"/>
  </g>
  <text x="600" y="405" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13">Checkov result today: 94 passing checks, 13 exceptions each documented in code. Next: make the SARIF jobs block on High/Critical.</text>
</svg>
