<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">File Vault security architecture</title><desc id="desc">Illustrative AWS architecture showing the application, private S3 storage, private RDS database, secrets management, IAM, and monitoring.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a35"/><stop offset="1" stop-color="#153b67"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#8bc6ff"/></marker></defs>
  <rect width="1200" height="680" fill="url(#bg)" rx="28"/>
  <text x="60" y="74" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">File Vault — Illustrative Security Architecture</text>
  <text x="60" y="108" fill="#c9def8" font-family="Arial, sans-serif" font-size="18">Terraform-managed AWS document platform • Diagram only — no account data or console screenshots</text>
  <rect x="70" y="170" width="210" height="120" rx="18" fill="#1f5c9e" filter="url(#shadow)"/><text x="175" y="220" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">User</text><text x="175" y="252" text-anchor="middle" fill="#dbeeff" font-family="Arial" font-size="16">Authenticated access</text>
  <rect x="390" y="170" width="250" height="120" rx="18" fill="#7c3aed" filter="url(#shadow)"/><text x="515" y="220" text-anchor="middle" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Application</text><text x="515" y="252" text-anchor="middle" fill="#ede9fe" font-family="Arial" font-size="16">Scoped IAM role</text>
  <rect x="770" y="145" width="330" height="380" rx="24" fill="#0b294a" stroke="#4f9eea" stroke-width="2"/><text x="800" y="184" fill="#9fd1ff" font-family="Arial" font-size="19" font-weight="700">PRIVATE AWS SERVICES</text>
  <rect x="810" y="210" width="250" height="78" rx="14" fill="#047857"/><text x="935" y="244" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Encrypted S3</text><text x="935" y="269" text-anchor="middle" fill="#d1fae5" font-family="Arial" font-size="14">Versioning • public block</text>
  <rect x="810" y="315" width="250" height="78" rx="14" fill="#b45309"/><text x="935" y="349" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Private RDS</text><text x="935" y="374" text-anchor="middle" fill="#fef3c7" font-family="Arial" font-size="14">Database not internet-facing</text>
  <rect x="810" y="420" width="250" height="78" rx="14" fill="#be185d"/><text x="935" y="454" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Secrets Manager</text><text x="935" y="479" text-anchor="middle" fill="#fce7f3" font-family="Arial" font-size="14">Credentials outside source code</text>
  <rect x="390" y="415" width="250" height="112" rx="18" fill="#0369a1" filter="url(#shadow)"/><text x="515" y="458" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">CloudTrail + CloudWatch</text><text x="515" y="487" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="15">Audit events • logs • monitoring</text>
  <line x1="280" y1="230" x2="390" y2="230" stroke="#8bc6ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="640" y1="220" x2="810" y2="250" stroke="#8bc6ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="640" y1="240" x2="810" y2="355" stroke="#8bc6ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="640" y1="255" x2="810" y2="460" stroke="#8bc6ff" stroke-width="4" marker-end="url(#arrow)"/><line x1="515" y1="290" x2="515" y2="415" stroke="#8bc6ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="60" y="620" fill="#9fd1ff" font-family="Arial" font-size="17">Security principle: limit access, keep data private, protect secrets, and record activity for investigation.</text>
</svg>
